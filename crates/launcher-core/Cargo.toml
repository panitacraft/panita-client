[package]
name = "launcher-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
md5 = "=0.8.1"
zeroize = "1"
base64 = "=0.22.1"
getrandom = "=0.4.3"
sha2 = "=0.10.9"
url = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
private-fs = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[features]
# Test builds only: PANITA_TEST_AUTH_BASE redirects the service chain to a local mock.
test-endpoints = []

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
