name: Build release installers
run-name: Build release installers ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package (${{ matrix.platform }} x64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: linux
            runner: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/phase-7-build
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ github.ref_name }}
      # A public client identifier, so a repository variable and not a secret.
      PANITA_LAUNCHER_API_KEY: ${{ vars.PANITA_LAUNCHER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version=$(node scripts/release-version.mjs "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/check-version.mjs --tag "$RELEASE_TAG"
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '11.25.0'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Install Linux build and inspection dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ca-certificates curl wget file git xz-utils pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils xdg-utils
          sudo apt-get install --no-install-recommends -y makepkg=6.0.2-6ubuntu2 pacman-package-manager=6.0.2-6ubuntu2 fakeroot libarchive-tools zstd
          sudo install -d /var/lib/pacman/local /var/lib/pacman/sync
          sudo pacman-db-upgrade
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend state
        run: pnpm --dir ui test
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Test Linux filesystem dependency
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/private-fs/Cargo.toml --lib --locked
          cargo test --manifest-path vendor/private-fs/Cargo.toml --lib --features force-walk --locked
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test release packaging contract
        run: node --test scripts/*.test.mjs
      - name: Build unsigned installers
        shell: bash
        env:
          # Updater signing only; this is not Windows publisher code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-beta.mjs --release-tag "$RELEASE_TAG"
      - name: Verify installer hashes and provenance
        shell: bash
        run: node scripts/verify-beta.mjs --release-tag "$RELEASE_TAG"
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/linux/verify-candidate.sh
      - name: Package for CachyOS and Arch Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node scripts/build-arch-package.mjs "$RELEASE_TAG"
          node scripts/verify-beta.mjs --release-tag "$RELEASE_TAG" --with-arch
      - name: Check Windows signature status
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $artifactPath = "target/releases/$env:RELEASE_VERSION/windows/panita-client_$($env:RELEASE_VERSION)_windows_x64_unsigned.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $artifactPath
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned installer; observed $($signature.Status)" }
      - name: Retain verified installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            target/releases/${{ steps.version.outputs.version }}/${{ matrix.platform }}/*.exe
            target/releases/${{ steps.version.outputs.version }}/${{ matrix.platform }}/*.deb
            target/releases/${{ steps.version.outputs.version }}/${{ matrix.platform }}/*.AppImage
            target/releases/${{ steps.version.outputs.version }}/${{ matrix.platform }}/*.pkg.tar.zst
            target/releases/${{ steps.version.outputs.version }}/${{ matrix.platform }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false

  publish:
    name: Attach installers to release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Download both verified platform builds
        run: |
          gh run download "$RUN_ID" --name release-windows --dir installers/windows
          gh run download "$RUN_ID" --name release-linux --dir installers/linux
      - name: Verify checksums and assemble assets
        run: |
          set -euo pipefail
          (cd installers/windows && sha256sum --check SHA256SUMS)
          (cd installers/linux && sha256sum --check SHA256SUMS)
          version="${RELEASE_TAG#v}"
          mkdir assets
          cp "installers/windows/panita-client_${version}_windows_x64_unsigned.exe" assets/
          cp "installers/linux/panita-client_${version}_linux_x64_unsigned.deb" assets/
          cp "installers/linux/panita-client_${version}_linux_x64_unsigned.AppImage" assets/
          cp "installers/linux/panita-client_${version}_archlinux_x64_unsigned.pkg.tar.zst" assets/
          cat installers/windows/SHA256SUMS installers/linux/SHA256SUMS > assets/SHA256SUMS
          (cd assets && sha256sum --check SHA256SUMS)
      - name: Create release if needed and attach installers
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "Panita Client $RELEASE_TAG" --generate-notes "${flags[@]}" assets/*
          else
            gh release upload "$RELEASE_TAG" assets/*
          fi
