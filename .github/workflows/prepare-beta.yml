name: Prepare unsigned beta
run-name: Prepare unsigned beta ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version in desktop/tauri.beta.conf.json
        required: true
        type: string
        default: 0.2.0-beta.3

permissions:
  contents: read

concurrency:
  group: prepare-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package (${{ matrix.platform }} x64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: linux
            runner: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/phase-7-build
      CARGO_BUILD_JOBS: 2
      EXPECTED_VERSION: ${{ inputs.version }}
      # A public client identifier, so a repository variable and not a secret.
      PANITA_LAUNCHER_API_KEY: ${{ vars.PANITA_LAUNCHER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Check requested source and version
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/develop
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("desktop/tauri.beta.conf.json")); if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(version) || version !== process.env.EXPECTED_VERSION) throw new Error("Requested version does not match the committed beta configuration");'
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '11.25.0'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Install Linux build and inspection dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ca-certificates curl wget file git xz-utils pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils xdg-utils
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend state
        run: pnpm --dir ui test
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Test Linux filesystem dependency
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/private-fs/Cargo.toml --lib --locked
          cargo test --manifest-path vendor/private-fs/Cargo.toml --lib --features force-walk --locked
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build unsigned candidates
        run: pnpm build:beta
      - name: Verify candidate hashes and provenance
        run: node scripts/verify-beta.mjs
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/linux/verify-candidate.sh
      - name: Check Windows signature status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactPath = "target/beta/$env:EXPECTED_VERSION/windows/panita-client_$($env:EXPECTED_VERSION)_windows_x64_unsigned.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $artifactPath
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned beta; observed $($signature.Status)" }
      - name: Retain candidates for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-beta-${{ inputs.version }}-${{ matrix.platform }}-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/*.exe
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/*.deb
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/*.AppImage
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/SHA256SUMS
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/candidate.json
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/candidate-appimage.json
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/build-environment.json
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/verification/*.txt
            target/beta/${{ inputs.version }}/${{ matrix.platform }}/verification/*.desktop
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
