[package]
name = "panita-desktop"
version = "0.3.0-beta.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core = { path = "../crates/launcher-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.1"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.0"

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.100.0"
windows-version = "=0.1.7"
winsafe = { version = "=0.0.29", default-features = false, features = ["shell"] }
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = "=5.19.0"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "=2.5.3"

[lints]
workspace = true

[features]
test-endpoints = ["launcher-core/test-endpoints"]
loader-validation = ["launcher-core/loader-validation"]
